# Local-development defaults only. Activate the `prod` profile in production;
# application-prod.properties requires explicit database, Redis, CORS and JWT settings.
# =========================================================
# Application
# =========================================================

spring.application.name=roamora-backend
server.port=8080


# =========================================================
# PostgreSQL Database
# =========================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/weatherwise}
spring.datasource.username=${DATABASE_USERNAME:weatherwise}
spring.datasource.password=${DATABASE_PASSWORD:weatherwise_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# Flyway
# =========================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# =========================================================
# Redis
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false


# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never


# =========================================================
# Swagger / OpenAPI
# =========================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# =========================================================
# Logging
# =========================================================

logging.level.root=INFO
logging.level.com.weatherwise=INFO


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${APP_JWT_SECRET:weatherwise-development-secret-key-change-this-to-a-long-random-value-2026}
app.jwt.expiration=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-days=${APP_JWT_REFRESH_EXPIRATION_DAYS:30}


# =========================================================
# Routing
# =========================================================

app.routing.base-url=https://router.project-osrm.org

# =========================================================
# OAuth2 - Google
# =========================================================

#spring.security.oauth2.client.registration.google.client-id=
#spring.security.oauth2.client.registration.google.client-secret=
#spring.security.oauth2.client.registration.google.scope=openid,profile,email

# =========================================================
# OAuth2 - Temporarily Disabled
# =========================================================

spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration

app.oauth2.authorized-redirect-uri=${OAUTH2_AUTHORIZED_REDIRECT_URI:http://localhost:5173/oauth2/callback}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.global-transport.ourairports.enabled=true
app.global-transport.ourairports.airports-url=https://ourairports.com/data/airports.csv
app.global-transport.ourairports.refresh-interval-ms=86400000
app.global-transport.ourairports.initial-delay-ms=120000

app.global-transport.osm.enabled=true
app.global-transport.osm.overpass-url=https://overpass-api.de/api/interpreter
app.global-transport.osm.overpass-urls=https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter,https://overpass.private.coffee/api/interpreter

app.flight.minimum-departure-buffer-minutes=120
app.flight.minimum-transit-transfer-minutes=20
app.flight.aviationstack.api-key=${AVIATIONSTACK_API_KEY:}
app.flight.aviationstack.base-url=${AVIATIONSTACK_BASE_URL:https://api.aviationstack.com/v1}
# =========================================================
# Optional Roamora Intelligence AI provider
# =========================================================

app.ai.enabled=${ROAMORA_AI_ENABLED:false}
app.ai.api-key=${ROAMORA_AI_API_KEY:}
app.ai.base-url=${ROAMORA_AI_BASE_URL:https://api.openai.com/v1/chat/completions}
app.ai.model=${ROAMORA_AI_MODEL:gpt-4o-mini}

# Optional Python agent orchestration sidecar (LangChain + LangGraph + CrewAI + MCP)
app.ai.agent-service-enabled=${ROAMORA_AGENT_SERVICE_ENABLED:false}
app.ai.agent-service-url=${ROAMORA_AGENT_SERVICE_URL:http://localhost:8090}
